spring:
  application:
    name: ChatApplication

  datasource:
    url: jdbc:postgresql://localhost:5432/chat
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis_password

  rabbitmq:
    host: localhost
    port: 5672
    username: rabbit
    password: admin

